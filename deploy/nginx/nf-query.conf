server {
    server_name nf.mystool.me query.baochai.cc;
    server_tokens off;

    access_log /var/log/nginx/nf-query.access.log nf_query;
    # Nginx error records cannot redact their raw request line. All request
    # status/upstream timing is in the safe access log, so discard this vhost's
    # request-context error stream rather than risk logging identifiers.
    error_log /dev/null crit;

    # This host is reached directly over the public Internet (no Cloudflare
    # Tunnel): trust CF-Connecting-IP only when the raw TCP peer is a known
    # Cloudflare edge address, and reject everything else outright so a
    # direct-to-origin request can't bypass Cloudflare's proxy/WAF layer.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    if ($nfq_from_cloudflare = 0) {
        return 403;
    }

    if ($host !~ '^(nf\.mystool\.me|query\.baochai\.cc)$') {
        return 421;
    }

    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header Cache-Control "no-store" always;
    # Mail bodies render in a sandboxed srcdoc iframe, which inherits this
    # policy. frame-src and inline styles exist only so that frame can show a
    # mail's own markup; script-src stays 'self' and the frame never gets
    # allow-scripts, so mail HTML cannot execute. img-src still names no remote
    # host, and the server strips every image source, so tracking pixels never
    # load. This must stay in step with PUBLIC_CSP in src/shared/http.js, since
    # a browser enforces both policies.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Health and Prometheus endpoints are for host-local collectors only.
    location ^~ /internal/ {
        access_log off;
        return 404;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:3790;
        include /etc/nginx/snippets/nf-query-proxy.conf;
        include /etc/nginx/snippets/nf-query-proxy-secret.conf;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3790;
        include /etc/nginx/snippets/nf-query-proxy.conf;
        include /etc/nginx/snippets/nf-query-proxy-secret.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3789;
        include /etc/nginx/snippets/nf-query-proxy.conf;
        # This source address is the only loopback peer accepted by the public
        # service's cgroup IP filter. Never forward the admin proxy secret.
        proxy_bind 127.0.0.2;
        proxy_set_header X-NFQ-Proxy-Auth "";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nf.mystool.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nf.mystool.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = nf.mystool.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = query.baochai.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name nf.mystool.me query.baochai.cc;
    return 404; # managed by Certbot
}
