# Install in /etc/nginx/conf.d/. The path is deliberately omitted: an attacker
# can put an external identifier in an arbitrary path. Request bodies, query
# strings, Cookie, Authorization, and upstream response bodies are not logged.
log_format nf_query '$time_iso8601 request_id=$request_id app_request_id=$upstream_http_x_request_id remote=$remote_addr '
                    'method=$request_method status=$status '
                    'bytes=$body_bytes_sent request_time=$request_time '
                    'upstream_time=$upstream_response_time upstream_status=$upstream_status';
