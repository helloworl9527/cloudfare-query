# Only the deliberately shared directory grants the public UID any access. Its
# setgid bit makes a newly-created bindings.db inherit nf-query-public. The
# sibling admin directory cannot be traversed by the public process.
d /var/lib/nf-query                    0751 root           root            -
d /var/lib/nf-query/shared             2750 nf-query-admin nf-query-public -
d /var/lib/nf-query/admin              0700 nf-query-admin nf-query-admin  -
z /var/lib/nf-query/shared/bindings.db 0640 nf-query-admin nf-query-public -

d /var/backups/nf-query        0700 nf-query-admin nf-query-admin -
d /var/backups/nf-query/weekly 0700 nf-query-admin nf-query-admin -
